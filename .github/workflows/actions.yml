name: Actions

# Tests and lints the composite actions under actions/ that the service repositories'
# deploy workflows call.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bats, actionlint, shellcheck
    runs-on: ${{ vars.LIGHT_WF_RUNNER }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run lint
      - run: mise run test
