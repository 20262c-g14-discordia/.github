name: Actions

# Tests and lints the composite actions under actions/ that the service repositories'
# deploy workflows call.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bats, actionlint, shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: mise run lint
      - run: mise run test
