# Reusable release workflow. release-please keeps one release PR open from the
# Conventional Commits on main (our squash-merged PR titles) and, when that PR merges,
# bumps the version, writes CHANGELOG.md, tags `vX.Y.Z` and publishes a GitHub release.
#
# Caller, in the repo's `.github/workflows/release.yml`:
#
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: write
#     pull-requests: write
#     issues: write
#   jobs:
#     release:
#       uses: 20262c-g14-discordia/.github/.github/workflows/release-please.yml@main
#       secrets: inherit
#
# The repo also carries `release-please-config.json` and `.release-please-manifest.json`
# at its root (see README). With the default workflow token GitHub does not run workflows
# on the PRs this opens; an org secret RELEASE_PLEASE_TOKEN (fine-grained PAT with
# contents and pull-requests read/write) is used instead when present.

name: Release

on:
  workflow_call:
    outputs:
      release_created:
        description: "true when this run published a release"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The tag of the release published by this run, if any"
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
