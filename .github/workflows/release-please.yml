# Reusable release workflow. release-please keeps one release PR open from the
# Conventional Commits on main (our squash-merged PR titles) and, when that PR merges,
# bumps the version, writes CHANGELOG.md, tags `<component>-vX.Y.Z` and publishes a
# GitHub release.
#
# Caller, in the repo's `.github/workflows/release.yml`:
#
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: write
#     pull-requests: write
#     issues: write
#   jobs:
#     release:
#       uses: 20262c-g14-discordia/.github/.github/workflows/release-please.yml@main
#       secrets: inherit
#
# The repo also carries `release-please-config.json` and `.release-please-manifest.json`
# at its root (see README). With the default workflow token GitHub does not run workflows
# on the PRs this opens; a RELEASE_PLEASE_TOKEN secret (fine-grained PAT with Contents,
# Pull requests and Issues read/write) is used instead when present. It must be a
# *repository* secret: the org is on the free plan, where organization secrets do not
# reach private repositories and this falls back to the workflow token without saying so.

name: Release

on:
  workflow_call:
    outputs:
      release_created:
        description: "true when this run published a release (root path `.` only)"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The tag of the release published by this run, if any (root path `.` only)"
        value: ${{ jobs.release-please.outputs.tag_name }}
      paths_released:
        description: "JSON array of the package paths released by this run, e.g. [\"apps/web\"]"
        value: ${{ jobs.release-please.outputs.paths_released }}
      all:
        description: "Every release-please output as a JSON object; per-path keys are `<path>--release_created`, `<path>--tag_name`, …"
        value: ${{ jobs.release-please.outputs.all }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      all: ${{ toJSON(steps.release.outputs) }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
