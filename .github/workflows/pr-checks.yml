# Reusable PR-convention check for every repository in the org.
#
# Callers (one job, no inputs):
#
#   on:
#     pull_request:
#       types: [opened, edited, reopened, synchronize]
#   jobs:
#     conventions:
#       uses: 20262c-g14-discordia/.github/.github/workflows/pr-checks.yml@main
#
# Fails when the title is not `type(scope): summary` (optionally prefixed with the Linear
# issue ID, as `linear issue pr` does), because the title becomes the squash commit on
# main. Warns when the title is longer than 72 characters, for the same reason.
#
# Fails when the body references a Linear issue with a non-closing magic word (`Ref`,
# `Part of`, ...) and its `## Still open` section does not say which of that issue's
# criteria stay unmet. Most finished issues stayed In Progress because their last PR said
# `Ref`, so a PR either closes its issue or says why not. The check lives in
# `actions/pr-references`, with its tests in `test/pr-references.bats`.
#
# Warns — and does not fail — when the body has no Linear magic-word line at all. The brief
# requires every PR to reference the story or task that originates it, but a missing
# reference is a prompt to go find the issue, not a reason to hold the branch: see
# `meta/CONTRIBUTING.md`. Release PRs (`release-please--*` branches) skip the body check.

name: PR conventions

on:
  workflow_call:

permissions: {}

jobs:
  conventions:
    name: Title and Linear references
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: "Title follows type(scope): summary"
        run: |
          types='feat|fix|docs|chore|refactor|test|ci|build|perf|revert'
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq "^(DIS-[0-9]+[: ] ?)?($types)(\([a-z0-9._/-]+\))?!?: [^ ].+"; then
            echo "::error title=PR title::'$PR_TITLE' is not 'type(scope): summary'. Types: $types."
            exit 1
          fi
          if [ "${#PR_TITLE}" -gt 72 ]; then
            echo "::warning title=PR title::${#PR_TITLE} characters; it becomes the squash commit subject, keep it under 72."
          fi
      - name: Body closes its Linear issue or says what stays open
        # Release PRs are opened by release-please from main itself; no issue originates them.
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        uses: 20262c-g14-discordia/.github/actions/pr-references@main
        with:
          body: ${{ github.event.pull_request.body }}
